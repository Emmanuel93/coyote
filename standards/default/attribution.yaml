# Patrones de atribución a herramientas o modelos de IA (regla R15).
# identity: identidades de herramientas en trailers Co-authored-by, autor y committer.
#   Cuentan el nombre del bot (con límites de palabra) o su buzón completo; nunca una
#   persona (Claude Dupont, Devin Smith, Haider) ni el dominio de una empresa.
# line_patterns: la línea completa es atribución (pies, trailers y enlaces de sesión); se elimina.
# phrase_patterns: la frase atribuye un texto útil a una herramienta. No se reescribe: se
#   reporta para que la persona la corrija. Exigen el nombre de la herramienta seguido de
#   puntuación, enlace o fin de línea, así "made by Claude Monet" no cuenta.
version: 1

# Fragmentos que los patrones usan como {{nombre}}.
vars:
  tools: 'claude\s+code|claude\s+(?:opus|sonnet|haiku|fable)(?:\s+[0-9][0-9.]*)?|claude|chatgpt|gpt-?[0-9][a-z0-9.-]*|github\s+copilot|copilot|gemini|codex|windsurf'
  after: '(?:\]|\s*[(.,;:!?)|<"'']|\s*$)'
  en: '(?:(?:entirely|partially|partly|mostly|fully)\s+)?(?:written|coded|generated|created|authored|produced|drafted|built|made|developed)\s+(?:entirely\s+|partially\s+|partly\s+|mostly\s+|fully\s+)?(?:with|by|using|via)\s+(?:the\s+help\s+of\s+)?\[?'
  es: '(?:(?:íntegramente|parcialmente|totalmente|en\s+parte)\s+)?(?:generad[oa]s?|escrit[oa]s?|codificad[oa]s?|cread[oa]s?|redactad[oa]s?|hech[oa]s?|programad[oa]s?|desarrollad[oa]s?)\s+(?:íntegramente\s+|parcialmente\s+|totalmente\s+|en\s+parte\s+)?(?:con|por|usando|mediante)\s+(?:(?:la\s+)?ayuda\s+de\s+)?\[?'
  bot: '[a-z0-9-]*(?:claude|cursor|copilot|codex|gemini|devin|chatgpt|jules|windsurf|codeium|tabnine|aider|amp)[a-z0-9-]*\[bot\]'

identity:
  names: '(?i)(\bclaude\s+(?:code|opus|sonnet|haiku|fable|mythos|[0-9])|\bcursor\s*agent\b|\bcopilot\b|\bchatgpt\b|\bgpt-?[0-9]|\bgemini\b|\bcodeium\b|\bwindsurf\b|\bcodex\b|\baider\b|\btabnine\b|\bcodewhisperer\b|\bamazon\s+q\b|\b{{bot}})'
  emails: '(?i)^(noreply@anthropic\.com|cursoragent@cursor\.com|amp@ampcode\.com|noreply@openai\.com|[0-9]+\+copilot@users\.noreply\.github\.com|(?:[0-9]+\+)?{{bot}}@users\.noreply\.github\.com)$'

line_patterns:
  - id: ai-session-trailer
    pattern: '(?i)^\s*\b(claude|copilot|cursor|devin|codex|windsurf|gemini|amp|jules)[- ](session|thread|task|run)(-id)?\s*:'
  - id: generated-footer
    pattern: '(?i)^[^\p{L}\p{N}]*(:robot:[^\p{L}\p{N}]*)?(<(sub|sup|small|p|em|i|b)>[^\p{L}\p{N}]*)*((this|este|esta)\s+(pr|pull\s+request|commit|change|cambio|code|código|patch)\s+((was|fue)\s+)?)?(generated|created|written|made|built|developed|authored|coded|produced|generad[oa]|cread[oa]|escrit[oa]|hech[oa]|desarrollad[oa]|producid[oa])\s+(with|by|using|via|con|por|usando|mediante)\s+\[?(claude\s+code|claude|github\s+copilot|copilot|chatgpt|codex|gemini(\s+code\s+assist)?|cursor\s+(agent|bugbot)|windsurf|cascade|aider|amazon\s+q|tabnine|codeium)\b{{after}}'
  - id: robot-emoji
    pattern: '(?i)🤖.*\b(generated|generado|claude\s+code|copilot|codex|chatgpt|gemini|windsurf|aider|devin|jules)\b'
  - id: ai-session-url
    pattern: '(?i)(claude\.ai/code/session_|app\.devin\.ai/sessions/|chatgpt\.com/codex/tasks/|jules\.google\.com/task|ampcode\.com/threads/|cursor\.com/agents\?)'
  - id: ai-noreply
    pattern: '(?i)\bnoreply@anthropic\.com\b'

phrase_patterns:
  - id: en-made-with-ai
    pattern: '(?i)\b{{en}}(?:{{tools}})\b{{after}}'
  - id: es-hecho-con-ia
    pattern: '(?i)\b{{es}}(?:{{tools}})\b{{after}}'
  - id: aider-prefix
    pattern: '(?i)^\s*aider:\s+'

# Rutas donde los patrones aparecen como datos de prueba. Cada proyecto agrega las suyas
# con un override de R15 (except, con reason), que queda visible en coyote standards diff.
allow_paths:
  - "**/testdata/**"
